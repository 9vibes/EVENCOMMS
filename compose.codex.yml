# Explicit standalone opt-in for experimental Codex; not an Umbrel upgrade overlay.
# docker compose -f compose.yml -f compose.codex.yml up -d --build --wait
services:
  server:
    environment:
      CODEX_BRIDGE_URL: http://codex-bridge:8001
      CODEX_BRIDGE_TOKEN: ${CODEX_BRIDGE_TOKEN:?Set a private random hexadecimal CODEX_BRIDGE_TOKEN}
    networks: [private, codex_link]

  codex-bridge:
    build:
      context: .
      dockerfile: deploy/codex/Dockerfile
    image: evencomms-codex:0.4.4
    pull_policy: never
    user: "10002:10002"
    init: true
    restart: unless-stopped
    environment:
      CODEX_BRIDGE_TOKEN: ${CODEX_BRIDGE_TOKEN:?Set a private random hexadecimal CODEX_BRIDGE_TOKEN}
    networks: [codex_link, codex_egress]
    # No app data, host home, credential store, Docker socket or published ports.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    pids_limit: 128
    ulimits:
      core: 0
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).close()"]
      start_period: 90s
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  codex_link:
    internal: true
  codex_egress:
    driver: bridge
