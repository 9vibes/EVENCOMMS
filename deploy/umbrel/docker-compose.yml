# STAGING ONLY: build/load evencomms:0.4.2 and evencomms-codex:0.4.2 from source.
# Umbrel supplies app_proxy's image and its platform compose configuration.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app_proxy:
    environment:
      APP_HOST: kunas-evencomms_web_1
      APP_PORT: 8080
      # EVENCOMMS authenticates operators and paired phone clients itself.
      PROXY_AUTH_ADD: "false"
    logging: *logging

  data_init:
    image: evencomms:0.4.2
    pull_policy: never
    user: "0:0"
    command: [python, -m, backend.init_data, --config-dir, /config, --codex-auth-dir, /codex-auth]
    network_mode: none
    read_only: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true
    volumes:
      - ${APP_DATA_DIR:?Umbrel must provide APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR:?Umbrel must provide APP_DATA_DIR}/config:/config
      - ${APP_DATA_DIR:?Umbrel must provide APP_DATA_DIR}/codex-auth:/codex-auth
    logging: *logging

  server:
    image: evencomms:0.4.2
    pull_policy: never
    init: true
    restart: unless-stopped
    depends_on:
      data_init:
        condition: service_completed_successfully
    environment:
      ADMIN_PASSWORD: ${APP_PASSWORD:?Umbrel must provide a nonempty APP_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://${DEVICE_DOMAIN_NAME:-umbrel.local}:28097}
      ALLOW_EVEN_LOCALHOST: ${ALLOW_EVEN_LOCALHOST:-false}
      DATABASE_PATH: /data/evencomms.sqlite3
      MODEL_CACHE: /data/models
      STT_ENABLED: ${STT_ENABLED:-true}
      STT_MODEL: ${STT_MODEL:-base.en}
      STT_TIMEOUT: ${STT_TIMEOUT:-90}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL-llama3.2:3b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-30}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TIMEOUT: ${OPENAI_TIMEOUT:-90}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-2048}
      CODEX_BRIDGE_URL: http://codex-bridge:8001
      CODEX_BRIDGE_TOKEN_FILE: /run/codex-auth/token
      MAX_SESSIONS: ${MAX_SESSIONS:-100}
      MAX_MESSAGES_PER_SESSION: ${MAX_MESSAGES_PER_SESSION:-1000}
      STREAM_ENABLED: ${STREAM_ENABLED:-true}
      PUBLIC_HOST: ${PUBLIC_HOST:-${DEVICE_DOMAIN_NAME:-umbrel.local}}
      RTMP_PORT: ${RTMP_PORT:-21936}
      MEDIA_API_URL: http://mediamtx:9997
      MEDIA_HLS_URL: http://mediamtx:8888
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    networks: [private, codex_link]
    volumes:
      - ${APP_DATA_DIR:?Umbrel must provide APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR:?Umbrel must provide APP_DATA_DIR}/codex-auth:/run/codex-auth:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

  codex-bridge:
    image: evencomms-codex:0.4.2
    pull_policy: never
    user: "10002:10002"
    init: true
    restart: unless-stopped
    depends_on:
      data_init:
        condition: service_completed_successfully
    environment:
      CODEX_BRIDGE_TOKEN_FILE: /run/codex-auth/token
    networks: [codex_link, codex_egress]
    # Only the private service credential; no app data, configs, homes or socket.
    volumes:
      - ${APP_DATA_DIR:?Umbrel must provide APP_DATA_DIR}/codex-auth:/run/codex-auth:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    pids_limit: 128
    ulimits:
      core: 0
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).close()"]
      start_period: 90s
      interval: 10s
      timeout: 5s
      retries: 3
    logging: *logging

  mediamtx:
    image: bluenviron/mediamtx:1.12.3@sha256:3634a1eed1288b93e8d22ed74694eae96d483fcf676cac5d0c91830ad1b86b3d
    entrypoint: [/mediamtx]
    command: [/config/mediamtx.yml]
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ${APP_DATA_DIR:?Umbrel must provide APP_DATA_DIR}/config:/config:ro
    ports:
      - "${RTMP_BIND:-0.0.0.0}:${RTMP_PORT:-21936}:1935/tcp"
    networks: [private]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging

  web:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    user: "101:101"
    entrypoint: [nginx]
    command: [-c, /config/nginx.conf, -g, "daemon off;"]
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ${APP_DATA_DIR:?Umbrel must provide APP_DATA_DIR}/config:/config:ro
    networks: [default, private]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, --spider, -q, http://127.0.0.1:8080/health]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging: *logging

networks:
  # Not internal:true: published RTMP must remain reachable by LAN/VPN encoders.
  private:
    driver: bridge
  codex_link:
    internal: true
  codex_egress:
    driver: bridge
