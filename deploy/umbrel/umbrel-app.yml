manifestVersion: 1
id: kunas-evencomms
name: EVENCOMMS
tagline: Local conversations between Even glasses and an operator
category: social
version: "0.2.0"
port: 28097
description: >-
  STAGING PACKAGE ONLY. Requires building evencomms:0.2.0 from source;
  use KNS-Umbrel for the digest-pinned installable release package.
  Pair an Even Hub client with a
  browser operator, transcribe short English utterances locally on CPU,
  and optionally draft replies with an existing local Ollama server.
  AI replies require operator approval. A reachable HTTPS origin and
  explicit origin configuration are required for phone deployment.
  An operator STREAM tab previews one authenticated RTMP feed over HLS,
  without recording or transcoding. Plaintext RTMP is for trusted LAN/VPN use only.
developer: EVENCOMMS contributors
dependencies: []
defaultUsername: ""
deterministicPassword: true
releaseNotes: >-
  0.2.0 STREAM staging. Rebuild/redeploy all services; initialization installs
  bundled nginx and MediaMTX configs automatically. Preserve the existing data
  directory when updating. The KNS-Umbrel package supplies the published image
  digest. Physical glasses and target-host acceptance testing remain necessary.
