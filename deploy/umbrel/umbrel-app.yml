manifestVersion: 1
id: kunas-evencomms
name: EVENCOMMS
tagline: Local conversations between Even glasses and an operator
category: social
version: "0.4.5"
port: 28097
description: >-
  SOURCE STAGING PACKAGE. Use KNS-Umbrel for the verified, digest-pinned release.
  EVENCOMMS connects an Even Hub companion with a browser operator for local
  speech transcription and human-approved replies. STREAM provides authenticated
  low-latency HLS monitoring with digital zoom and still-frame capture.
  RESEARCH uses ChatGPT code login and displays responses as they are generated.
  An eligible ChatGPT plan is required; account usage limits and data controls apply.
  Only explicit Send submits Research history and selected stills. No continuous
  video/audio or automatic replies to glasses. There is no paid API fallback.
  OAuth credentials remain in isolated bridge memory until disconnect or expiry.
  Use trusted networking and HTTPS for private conversations and phone deployment.
developer: EVENCOMMS contributors
dependencies: []
defaultUsername: ""
deterministicPassword: true
releaseNotes: >-
  0.4.5 adds live streaming Research replies and code-login-only controls.
  Removes the unused wearer-client link and simplifies Research settings.
  The last operator reply preview now matches the companion's green-on-black
  glasses display. Interrupted replies preserve the question and attached frames;
  only completed replies are saved in the local chat history.
  Updates the server and Codex bridge together. Preserves app ID, ports, password,
  database, model cache and private service token. Reconnect ChatGPT after updating.
